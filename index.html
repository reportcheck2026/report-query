.topbar::before {
  content: "";
  position: absolute; inset: 0;
  background:
    linear-gradient(180deg, rgba(6,13,26,.34) 0%, rgba(6,13,26,.20) 45%, rgba(6,13,26,.62) 100%),
    linear-gradient(90deg,
      rgba(6,13,26,.95) 0%,
      rgba(6,13,26,.86) 22%,
      rgba(6,13,26,.52) 48%,
      rgba(6,13,26,.24) 70%,
      rgba(6,13,26,.46) 100%);
}
.topbar::after {
  content: "";
  position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
  background: linear-gradient(90deg, rgba(255,255,255,.55), rgba(255,255,255,.06) 60%, transparent);
}
.topbar-inner {
  position: relative; z-index: 1;
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px;
  padding-top: 74px; padding-bottom: 80px;
}
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.mark {
  width: 44px; height: 44px; border-radius: 11px; flex-shrink: 0;
  background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.24);
  display: flex; align-items: center; justify-content: center;
}
.mark svg { width: 24px; height: 24px; stroke: #fff; }
h1 { font-size: 22px; font-weight: 600; letter-spacing: 1.6px; line-height: 1.4; color: #fff;
  text-shadow: 0 1px 12px rgba(3,8,18,.55); }
.brand-sub {
  font-size: 12px; color: rgba(255,255,255,.74); display: block;
  margin-top: 4px; letter-spacing: 2.4px;
  text-shadow: 0 1px 10px rgba(3,8,18,.5);
}

/* ===== 查询区 ===== */
.search {
  background: #fff;
  border: 1px solid rgba(228,231,236,.9);
  border-radius: 16px;
  padding: 22px;
  margin-top: 26px;
  box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 10px 28px rgba(16,24,40,.06);
}
.search label { font-size: 13px; font-weight: 600; color: var(--ink-2); display: block; margin-bottom: 8px; }
.search-row { display: flex; gap: 10px; }
#reportNo {
  flex: 1; min-width: 0;
  padding: 13px 14px;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  font-size: 16px;
  font-family: var(--mono);
  letter-spacing: .4px;
  color: var(--ink);
  background: #fff;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
#reportNo::placeholder { font-family: inherit; letter-spacing: 0; color: var(--ink-3); }
#reportNo:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(29,78,216,.12); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: none; border-radius: 10px;
  font-size: 15px; font-weight: 600; font-family: inherit;
  cursor: pointer; white-space: nowrap;
  transition: background .15s, border-color .15s, transform .05s;
}
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--accent); color: #fff; padding: 0 26px; }
.btn-primary:hover { background: #1a45c0; }
.btn-ghost {
  background: #fff; color: var(--ink-2);
  border: 1px solid var(--line); padding: 9px 14px; font-size: 14px; font-weight: 500;
}
.btn-ghost:hover { border-color: #cfd6e3; color: var(--ink); }
.btn-ghost svg { width: 16px; height: 16px; }
.search-foot { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
.hint { font-size: 12px; color: var(--ink-3); line-height: 1.5; }

/* ===== 摄像头 ===== */
.scan-wrap { display: none; margin-top: 16px; }
.scan-wrap.open { display: block; }
.video-box { position: relative; overflow: hidden; border-radius: 12px; background: #0b1220; }
#camera { width: 100%; display: block; }
.scan-frame {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  width: 62%; height: 50%;
  border: 2px solid rgba(255,255,255,.85);
  border-radius: 8px; pointer-events: none;
}
.scan-line {
  position: absolute; left: 6%; right: 6%; height: 2px;
  background: linear-gradient(90deg, transparent, #4ade80, transparent);
  animation: scanmove 1.8s ease-in-out infinite; pointer-events: none;
}
@keyframes scanmove { 0%,100% { top: 18%; } 50% { top: 80%; } }
.scan-status { font-size: 13px; color: var(--ink-2); text-align: center; padding: 10px 0 2px; }
.btn-stop { display: block; margin: 10px auto 0; background: #1f2a3d; color: #fff; padding: 9px 22px; font-size: 14px; }
.btn-stop:hover { background: #16202f; }

/* ===== 状态提示 ===== */
.msg {
  display: none; align-items: center; gap: 8px;
  margin-top: 16px; padding: 12px 14px;
  border-radius: 10px; font-size: 14px;
}
.msg.show { display: flex; }
.msg svg { width: 17px; height: 17px; flex-shrink: 0; }
.msg-error { background: var(--bad-bg); color: var(--bad); border: 1px solid #fecdca; }
.msg-empty { background: #fffaeb; color: #b54708; border: 1px solid #fedf89; }
.msg-loading { background: var(--accent-soft); color: var(--accent); border: 1px solid #d1e0ff; }
.spinner {
  width: 15px; height: 15px; flex-shrink: 0;
  border: 2px solid #c7d7fe; border-top-color: var(--accent);
  border-radius: 50%; animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== 报告结果 ===== */
.doc {
  background: #fff;
  border: 1px solid rgba(228,231,236,.9);
  border-radius: 16px;
  margin-top: 18px;
  overflow: hidden;
  box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 10px 28px rgba(16,24,40,.06);
}
.doc[hidden] { display: none; }
.doc-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap;
  padding: 16px 20px;
  border-bottom: 1px solid var(--line);
  background: #fbfcfd;
}
.doc-title { font-size: 13px; font-weight: 600; color: var(--ink-2); letter-spacing: .4px; }
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 999px;
  font-size: 13px; font-weight: 600;
  background: var(--ok-bg); color: var(--ok);
  border: 1px solid #abefc6;
}
.badge.bad { background: var(--bad-bg); color: var(--bad); border-color: #fecdca; }
.badge svg { width: 15px; height: 15px; }

.doc-no {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  padding: 20px 20px 16px;
}
.doc-no .k { font-size: 12px; color: var(--ink-3); }
.doc-no .v {
  font-family: var(--mono); font-size: 22px; font-weight: 700;
  letter-spacing: .8px; color: var(--ink); word-break: break-all;
}
.btn-copy {
  margin-left: 2px; align-self: center;
  background: none; border: 1px solid var(--line);
  color: var(--ink-3); font-size: 12px; padding: 4px 10px;
  border-radius: 7px; cursor: pointer; transition: color .15s, border-color .15s;
}
.btn-copy:hover { color: var(--accent); border-color: #c7d7fe; }

.doc-body {
  display: grid; grid-template-columns: 1fr 200px;
  gap: 0 28px;
  padding: 4px 20px 20px;
}
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; }
.field.wide { grid-column: span 2; }
.field dt { font-size: 12px; color: var(--ink-3); margin-bottom: 3px; }
.field dd {
  font-size: 15px; font-weight: 500; color: var(--ink);
  line-height: 1.55; word-break: break-word;
}
.field dd.pre { white-space: pre-line; }
.field dd.mono { font-family: var(--mono); letter-spacing: .3px; }

.qr {
  border-left: 1px solid var(--line);
  padding-left: 28px;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
}
#qrCanvas {
  width: 160px; height: 160px;
  border: 1px solid var(--line); border-radius: 10px; padding: 5px; background: #fff;

function $(id) { return document.getElementById(id); }

function showMsg(type, text) {
  var box = $("msgBox");
  box.className = "msg show msg-" + type;
  if (type === "loading") {
    box.innerHTML = '<span class="spinner"></span><span>' + text + "</span>";
    return;
  }
  var icon = type === "error"
    ? '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>'
    : '<polyline points="20 6 9 17 4 12"/>';
  box.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" '
    + 'stroke-linecap="round" stroke-linejoin="round">' + icon + "</svg><span>" + text + "</span>";
}
function hideMsg() { $("msgBox").className = "msg"; }

function searchReport() {
  var no = $("reportNo").value.trim().toUpperCase();
  hideMsg();
  if (!no) { showMsg("empty", "请输入报告编号"); return; }

  showMsg("loading", "正在核验报告信息…");
  setTimeout(function () {
    if (reportDB.hasOwnProperty(no)) {
      var d = reportDB[no];
      $("fNo").textContent = d.no;
      $("fName").textContent = d.name || "-";
      $("fModel").textContent = d.model || "-";
      $("fCompany").textContent = d.company || "-";
      $("fAgency").textContent = d.agency || "-";
      $("fDate").textContent = d.date || "-";
      $("fConclusion").textContent = d.conclusion || "-";
      $("fTime").textContent = new Date().toLocaleString("zh-CN", { hour12: false });

      var badge = $("statusBadge");
      if (d.pass) {
        badge.className = "badge";
        badge.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" '
          + 'stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>核验通过 · 检测合格';
      } else {
        badge.className = "badge bad";
        badge.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" '
          + 'stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>核验通过 · 检测不合格';
      }

      $("reportCard").hidden = false;
      $("copyBtn").textContent = "复制";
      hideMsg();
      makeQR(no);
      $("reportCard").scrollIntoView({ behavior: "smooth", block: "nearest" });
    } else {
      $("reportCard").hidden = true;
      showMsg("error", "未查询到编号为 " + no + " 的报告，请核对编号后重试");
    }
  }, 400);
}

function makeQR(no) {
  var reportNo = no || $("fNo").textContent;
  if (!reportNo || typeof QRCode === "undefined") return;
  var base = location.href.split("?")[0].split("#")[0];
  var url = base + "?no=" + encodeURIComponent(reportNo);
  try {
    QRCode.toCanvas($("qrCanvas"), url, { width: 160, margin: 1, errorCorrectionLevel: "M" });
  } catch (e) {}
}

function copyNo() {
  var text = $("fNo").textContent;
  var done = function () {
    var b = $("copyBtn");
    b.textContent = "已复制";
    setTimeout(function () { b.textContent = "复制"; }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done); });
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done) {
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); done(); } catch (e) {}
  document.body.removeChild(ta);
}

var stream = null;
var scanning = false;
var rafId = null;

function toggleScan() {
  var wrap = $("scanWrap");
  if (wrap.classList.contains("open")) { stopScan(); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showMsg("error", "当前浏览器不支持摄像头，请手动输入编号查询");
    return;
  }
  navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: { ideal: "environment" } }
  }).then(function (s) {
    stream = s;
    wrap.classList.add("open");
    var video = $("camera");
    video.srcObject = s;
    video.setAttribute("playsinline", "true");
    video.play();
    scanning = true;
    tick();
  }).catch(function () {
    showMsg("error", "无法打开摄像头，请检查权限后重试，或手动输入编号");
  });
}

function tick() {
  if (!scanning) return;
  var video = $("camera");
  if (video.readyState >= video.HAVE_ENOUGH_DATA && video.videoWidth) {
    var canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    var ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    try {
      var code = jsQR(ctx.getImageData(0, 0, canvas.width, canvas.height).data,
                      canvas.width, canvas.height);
      if (code && code.data) {
        var raw = code.data.trim();
        var m = raw.match(/[?&]no=([^&]+)/);
        var no = m ? decodeURIComponent(m[1]) : raw;
        stopScan();
        $("reportNo").value = no;
        searchReport();
        return;
      }
    } catch (e) {}
  }
  rafId = requestAnimationFrame(tick);
}

function stopScan() {
  scanning = false;
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
  $("scanWrap").classList.remove("open");
}

(function autoQuery() {
  var m = (location.search || "").match(/[?&]no=([^&]+)/);
  if (!m || !m[1]) return;
  var no = decodeURIComponent(m[1]).trim().toUpperCase();
  $("reportNo").value = no;
  setTimeout(searchReport, 250);
})();
</script>
</body>
