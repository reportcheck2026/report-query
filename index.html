<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="检测报告真伪查询系统，扫码或输入报告编号核验检测报告信息">
<title>检测报告查询系统</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d4ed8'/%3E%3Cpath d='M10 9h4v4h-4zm8 0h4v4h-4zM10 19h4v4h-4zm8 0h4v4h-4z' fill='%23fff'/%3E%3Crect x='17' y='9' width='2' height='14' fill='%23fff' transform='rotate(45 18 16)'/%3E%3C/svg%3E">
<style>
/* ===== 基础 ===== */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --primary: #1d4ed8;
  --primary-dark: #1e40af;
  --bg: #f2f4f8;
  --card: #ffffff;
  --line: #e5e9f0;
  --text: #1a2233;
  --text-2: #5b6472;
  --ok: #16a34a;
  --bad: #dc2626;
  --warn: #d97706;
  --radius: 14px;
}
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  padding-bottom: env(safe-area-inset-bottom);
}

/* ===== 页面骨架 ===== */
.page { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
.header { text-align: center; padding: 22px 0 18px; }
.brand-mark {
  width: 56px; height: 56px; margin: 0 auto 12px;
  background: linear-gradient(135deg, #2563eb, #1e40af);
  border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 20px rgba(29,78,216,.25);
}
.brand-mark svg { width: 32px; height: 32px; }
.header h1 { font-size: 21px; font-weight: 700; letter-spacing: 1px; }
.header .sub { font-size: 14px; color: var(--text-2); margin-top: 4px; }

/* ===== 卡片 ===== */
.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: 0 2px 10px rgba(23,32,58,.06);
  padding: 18px;
  margin-bottom: 16px;
}

/* ===== 查询区 ===== */
.search-row { display: flex; gap: 10px; }
#reportNo {
  flex: 1; min-width: 0;
  padding: 12px 14px;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  font-size: 16px;
  color: var(--text);
  outline: none;
  background: #fbfcfe;
  transition: border-color .15s;
}
#reportNo:focus { border-color: var(--primary); background: #fff; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 0 20px;
  border: none; border-radius: 10px;
  font-size: 15px; font-weight: 600;
  cursor: pointer;
  transition: filter .15s, transform .05s;
  white-space: nowrap;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { filter: brightness(1.08); }
.btn-scan {
  width: 100%; margin-top: 12px;
  background: #fff; color: var(--primary);
  border: 1.5px solid var(--primary);
  padding: 11px 0;
}
.btn-scan:hover { background: #f0f5ff; }
.btn-scan svg { width: 17px; height: 17px; }
.scan-hint { font-size: 12px; color: var(--text-2); text-align: center; margin-top: 10px; }

/* ===== 摄像头 ===== */
.scan-wrap { display: none; margin-top: 14px; }
.scan-wrap.open { display: block; }
.video-box {
  position: relative; overflow: hidden;
  border-radius: 10px; background: #0b1220;
}
#camera { width: 100%; display: block; }
.scan-frame {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  width: 62%; height: 50%;
  border: 2px solid rgba(255,255,255,.85);
  border-radius: 8px;
  pointer-events: none;
}
.scan-line {
  position: absolute; left: 6%; right: 6%; height: 2px;
  background: linear-gradient(90deg, transparent, #4ade80, transparent);
  animation: scanmove 1.8s ease-in-out infinite;
  pointer-events: none;
}
@keyframes scanmove { 0%,100% { top: 18%; } 50% { top: 80%; } }
.scan-status { font-size: 14px; color: #cfd8ea; text-align: center; padding: 10px 0 2px; }
.btn-stop {
  display: block; margin: 10px auto 0;
  background: #334155; color: #fff; padding: 8px 22px;
}

/* ===== 提示与错误 ===== */
.msg { display: none; border-radius: 10px; padding: 12px 14px; font-size: 14px; margin-bottom: 14px; }
.msg.show { display: flex; align-items: center; gap: 8px; }
.msg svg { flex-shrink: 0; width: 18px; height: 18px; }
.msg-error { background: #fef2f2; color: var(--bad); border: 1px solid #fecaca; }
.msg-empty { background: #fffbeb; color: var(--warn); border: 1px solid #fde68a; }
.msg-loading { background: #eff6ff; color: var(--primary); border: 1px solid #bfdbfe; }

/* ===== 报告结果 ===== */
.report-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.report-head h2 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.report-head h2 svg { width: 20px; height: 20px; color: var(--primary); }
.badge { font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 999px; letter-spacing: 1px; }
.badge.ok { background: #dcfce7; color: var(--ok); }
.badge.bad { background: #fee2e2; color: var(--bad); }
.report-body { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.row { display: flex; align-items: flex-start; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: none; }
.row .k { width: 92px; flex-shrink: 0; padding: 11px 12px; font-size: 14px; color: var(--text-2); background: #f8fafc; }
.row .v { flex: 1; min-width: 0; padding: 11px 12px; font-size: 14px; font-weight: 500; word-break: break-all; }
.footer-note { text-align: center; font-size: 12px; color: #9aa3b2; padding: 6px 0 0; }

/* ===== 查询二维码 ===== */
.qr-area {
  margin-top: 16px; padding-top: 16px;
  border-top: 1px dashed var(--line);
  text-align: center;
}
.qr-tip { font-size: 13px; color: var(--text-2); margin-bottom: 10px; }
#qrCanvas { width: 168px; height: 168px; border: 1px solid var(--line); border-radius: 10px; padding: 6px; background: #fff; }
.btn-qr { margin-top: 12px; width: auto; padding: 9px 18px; font-size: 14px; }

/* ===== 加载动画 ===== */
.spinner {
  width: 15px; height: 15px; flex-shrink: 0;
  border: 2px solid #bfdbfe; border-top-color: var(--primary);
  border-radius: 50%; animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 380px) {
  .search-row { flex-wrap: wrap; }
  .btn-query { width: 100%; padding: 12px 0; }
}
</style>
</head>
<body>
<div class="page">

  <!-- ===== 头部 ===== -->
  <header class="header">
    <div class="brand-mark">
      <svg viewBox="0 0 32 32" fill="none">
        <rect x="6" y="5" width="20" height="22" rx="3" stroke="#fff" stroke-width="2.4"/>
        <path d="M11 13h4v4h-4zM17 13h4v4h-4zM11 20h4v2h-4zM17 20h4v2h-4z" fill="#fff"/>
        <path d="M22 6l3 3-3 3" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>检测报告查询系统</h1>
    <div class="sub">报告真伪在线核验 · 扫码即查</div>
  </header>

  <!-- ===== 查询区 ===== -->
  <section class="card">
    <div class="search-row">
      <input id="reportNo" type="text" inputmode="text" autocomplete="off"
             placeholder="请输入报告编号，如 JC202609001" maxlength="40"
             onkeydown="if(event.key==='Enter')searchReport()">
      <button class="btn btn-primary btn-query" onclick="searchReport()">查 询</button>
    </div>
    <button class="btn btn-scan" onclick="toggleScan()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/>
        <path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
        <line x1="7" y1="12" x2="17" y2="12"/><line x1="12" y1="7" x2="12" y2="17"/>
      </svg>
      扫描报告二维码
    </button>

    <!-- 摄像头扫码区 -->
    <div class="scan-wrap" id="scanWrap">
      <div class="video-box">
        <video id="camera" playsinline muted></video>
        <div class="scan-frame"></div>
        <div class="scan-line"></div>
      </div>
      <div class="scan-status">正在识别二维码，请将报告二维码置于框内</div>
      <button class="btn btn-stop" onclick="stopScan()">关闭扫码</button>
    </div>
  </section>

  <!-- ===== 状态消息 ===== -->
  <div class="msg" id="msgBox"></div>

  <!-- ===== 报告结果 ===== -->
  <section class="card" id="reportCard" style="display:none">
    <div class="report-head">
      <h2>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
          <line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/>
        </svg>
        检测报告信息
      </h2>
      <span class="badge" id="badge">合格</span>
    </div>
    <div class="report-body">
      <div class="row"><div class="k">报告编号</div><div class="v" id="fNo"></div></div>
      <div class="row"><div class="k">产品名称</div><div class="v" id="fName"></div></div>
      <div class="row"><div class="k">规格型号</div><div class="v" id="fModel"></div></div>
      <div class="row"><div class="k">委托单位</div><div class="v" id="fCompany"></div></div>
      <div class="row"><div class="k">检测机构</div><div class="v" id="fAgency"></div></div>
      <div class="row"><div class="k">检测日期</div><div class="v" id="fDate"></div></div>
      <div class="row"><div class="k">检测结论</div><div class="v" id="fConclusion"></div></div>
      <div class="row"><div class="k">签发人</div><div class="v" id="fSigner"></div></div>
      <div class="row"><div class="k">查询时间</div><div class="v" id="fTime"></div></div>
    </div>

    <!-- 查询二维码 -->
    <div class="qr-area" id="qrArea" style="display:none">
      <div class="qr-tip">扫码可再次查询本报告</div>
      <canvas id="qrCanvas"></canvas>
      <button class="btn btn-scan btn-qr" onclick="makeQR()">重新生成查询二维码</button>
    </div>
  </section>

  <div class="footer-note">本页面用于检测报告信息核验 · 演示环境使用内置示例数据<br>如有疑问请联系检测机构核验</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
<script>
/* ===== 演示数据库（正式上线请替换为后端接口） ===== */
var reportDB = {
  "JC202609001": {
    no: "JC202609001", name: "铝合金建筑型材", model: "6063-T5 / 50系列",
    company: "XX建设工程有限公司", agency: "江苏省XX质量检测中心",
    date: "2026-09-01",
    conclusion: "所检项目符合 GB/T 5237.1-2017 标准要求",
    pass: true, signer: "张建国"
  },
  "JC202609002": {
    no: "JC202609002", name: "SBS改性沥青防水卷材", model: "PY-PE-PE 4.0mm",
    company: "XX建设集团有限公司", agency: "江苏省XX质量检测中心",
    date: "2026-09-05",
    conclusion: "所检项目符合 GB 18242-2008 标准要求",
    pass: true, signer: "李文华"
  },
  "JC202609003": {
    no: "JC202609003", name: "混凝土试块", model: "C30",
    company: "XX市政工程有限公司", agency: "淮安市XX建设工程检测有限公司",
    date: "2026-09-08",
    conclusion: "抗压强度不满足设计要求，判为不合格",
    pass: false, signer: "王明远"
  }
};

/* ===== 工具函数 ===== */
function $(id) { return document.getElementById(id); }
function showMsg(type, text) {
  var box = $("msgBox");
  box.className = "msg show msg-" + type;
  box.innerHTML = type === "loading"
    ? '<span class="spinner"></span><span>' + text + "</span>"
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
      + (type === "error"
        ? '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>'
        : '<polyline points="20 6 9 17 4 12"/>')
      + "</svg><span>" + text + "</span>";
}
function hideMsg() { $("msgBox").className = "msg"; }

/* ===== 查询逻辑 ===== */
function searchReport() {
  var no = $("reportNo").value.trim().toUpperCase();
  hideMsg();
  if (!no) { showMsg("empty", "请输入报告编号"); return; }

  showMsg("loading", "正在核验报告信息…");
  setTimeout(function () {   // 模拟网络请求
    if (reportDB.hasOwnProperty(no)) {
      var d = reportDB[no];
      $("fNo").textContent = d.no;
      $("fName").textContent = d.name;
      $("fModel").textContent = d.model || "-";
      $("fCompany").textContent = d.company;
      $("fAgency").textContent = d.agency;
      $("fDate").textContent = d.date;
      $("fConclusion").textContent = d.conclusion;
      $("fSigner").textContent = d.signer;
      $("fTime").textContent = new Date().toLocaleString("zh-CN", { hour12: false });
      var badge = $("badge");
      badge.textContent = d.pass ? "检测合格" : "检测不合格";
      badge.className = "badge " + (d.pass ? "ok" : "bad");
      $("reportCard").style.display = "block";
      $("qrArea").style.display = "block";
      hideMsg();
      makeQR(no);
      $("reportCard").scrollIntoView({ behavior: "smooth", block: "nearest" });
    } else {
      hideMsg();
      $("reportCard").style.display = "none";
      showMsg("error", "未查询到该编号对应的报告，请核对后重试");
    }
  }, 400);
}

/* ===== 生成查询二维码 ===== */
function makeQR(no) {
  var reportNo = no || $("fNo").textContent;
  if (!reportNo) return;
  // 二维码内容 = 当前页面地址 + 报告编号参数，扫码打开后直达查询结果
  var base = location.href.split("?")[0].split("#")[0];
  var url = base + "?no=" + encodeURIComponent(reportNo);
  if (typeof QRCode === "undefined") return;
  try {
    QRCode.toCanvas($("qrCanvas"), url, {
      width: 168,
      margin: 1,
      errorCorrectionLevel: "M"
    });
  } catch (e) { /* 二维码生成失败不影响查询结果展示 */ }
}

/* ===== 摄像头扫码 ===== */
var stream = null;
var scanning = false;

function toggleScan() {
  var wrap = $("scanWrap");
  if (wrap.classList.contains("open")) { stopScan(); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showMsg("error", "当前浏览器不支持摄像头，请手动输入编号查询");
    return;
  }
  navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: { ideal: "environment" } }
  }).then(function (s) {
    stream = s;
    wrap.classList.add("open");
    var video = $("camera");
    video.srcObject = s;
    video.setAttribute("playsinline", "true");
    video.play();
    scanning = true;
    requestAnimationFrame(tick);
  }).catch(function () {
    showMsg("error", "无法打开摄像头，请检查权限后重试，或手动输入编号");
  });
}

function tick() {
  if (!scanning) return;
  var video = $("camera");
  if (video.readyState >= video.HAVE_ENOUGH_DATA) {
    var canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
    try {
      var code = jsQR(canvas.getImageData(0, 0, canvas.width, canvas.height).data,
                      canvas.width, canvas.height);
      if (code && code.data) {
        stopScan();
        $("reportNo").value = code.data.trim();
        searchReport();
        return;
      }
    } catch (e) { /* 单帧解析失败，继续 */ }
  }
  requestAnimationFrame(tick);
}

function stopScan() {
  scanning = false;
  if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
  $("scanWrap").classList.remove("open");
}

/* ===== URL 参数自动跳转查询 =====
   扫码打开 页面地址?no=报告编号 时，自动查询并直达结果 */
(function autoQuery() {
  var m = (location.search || "").match(/[?&]no=([^&]+)/);
  if (!m || !m[1]) return;
  var no = decodeURIComponent(m[1]).trim().toUpperCase();
  $("reportNo").value = no;
  setTimeout(function () {
    searchReport();
    window.scrollTo({ top: 0, behavior: "auto" });
  }, 250);
})();
</script>
</body>
</html>
